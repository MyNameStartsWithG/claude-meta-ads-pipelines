name: test

on:
  push:
  pull_request:

jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m json.tool guardrails.json > /dev/null
      - run: python -m json.tool .claude/settings.json > /dev/null
      - run: python -m json.tool .mcp.json > /dev/null
      - run: python -m unittest discover -s tests -v
